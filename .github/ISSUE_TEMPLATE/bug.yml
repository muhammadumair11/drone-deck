name: Bug report
description: Report a reproducible Drone Deck problem
body:
  - type: markdown
    attributes:
      value: Check Known issues first. Remove secrets, personal paths and vehicle/location data from attachments.
  - type: input
    id: version
    attributes:
      label: Drone Deck version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows, WSL/distribution and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or screenshots

[package]
name = "drone-deck"
version = "0.7.0"
edition = "2024"

[workspace]

[dependencies]
rune = { path = "../crates/rune", default-features = false, features = ["accessibility", "embedded-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2

[profile.dev]
debug = 0


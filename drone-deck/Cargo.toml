[package]
name = "drone-deck"
version = "0.9.1"
edition = "2024"

[workspace]

[dependencies]
mavlink = { version = "0.21", default-features = false, features = ["std", "dialect-ardupilotmega", "mav2-message-extensions"] }
rune-notify = { path = "../crates/rune-notify" }
rune = { path = "../crates/rune", default-features = false, features = ["accessibility", "embedded-fonts", "native-file-dialog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }

[profile.release]
opt-level = 2

[profile.dev]
debug = 0

